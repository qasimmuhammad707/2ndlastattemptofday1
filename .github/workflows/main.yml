name: Deploy Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup and Permissions on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Folder banana agar nahi hai (sudo ke sath)
            sudo mkdir -p /var/www/html
            
            # 2. Permissions set karna
            sudo chown -R ubuntu:ubuntu /var/www/html
            sudo chmod -R 755 /var/www/html

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html,page1.html,page2.html"
          target: "/var/www/html/"

      # Step 3: Final permissions set karna (Web Server ke liye)
      - name: Finalize Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Files ko web-data ownership dena taake browser sahi se load kare
            sudo chown -R www-data:www-data /var/www/html
